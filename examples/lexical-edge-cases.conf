# Visual fixture only. Server (capital S) below is deliberately invalid.
# Quotes, variables, and comments must not add folding markers.
http {
    server {
        listen 8443 ssl;
        http2 on;
        http3 on;
        ssl_certificate_cache max=1000;
        add_header_inherit merge;

        set $plain $request_uri;
        set $braced ${request_uri};
        set $empty "";
        set $hash "# { } ; remain inside this string";
        set $escaped "before \"#still string\" after";
        set $single 'it\'s # still a string';
        set $backslash "tail\\";
        set $url "https://$host${request_uri}";
        # } " A comment must not close the block or start a string.

        location ~ "^/files/[0-9]{1,3}\\.txt$" {
            if ($request_uri !~* "^/health$") {
                return 403; # real comment
            }
            try_files $uri @fallback;
        }
        location @fallback { return 200 "OK"; }
        location $arg_preview { return 200 "${host}"; }
        Server deliberately_invalid; # no directive styling on Server
    }
}
