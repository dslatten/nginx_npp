# Visual highlighting fixture, NOT a deployable Nginx configuration.
# This combines optional and version-dependent features through Nginx 1.31.9.
# Certificate paths and upstreams are placeholders. Do not run this as a server.
# Check both Nginx and Nginx-Dark in Notepad++; see examples/README.md.

worker_processes auto;
worker_shutdown_timeout 10s;

events {
    worker_connections 1024;
}

http {
    # Variables, named captures, map values, and a quoted regular expression.
    map $http_x_preview $is_preview {
        default 0;
        on 1;
        ~*^enabled$ 1;
    }

    map $uri $asset_id {
        default "unknown";
        "~^/assets/(?<asset>[a-z0-9]{8})$" $asset;
    }

    # JSON extraction (optional ngx_http_json_module, added in 1.31.5).
    json_max_depth 16;
    json_set $request_label $request_body metadata.label;
    json_set $first_tag $request_body tags[0];
    json_set $dotted_key $request_body 'metadata["display.name"]';

    upstream application {
        zone application 64k;
        server 127.0.0.1:9000;
        keepalive 16;
    }

    # HTTP/2, HTTP/3, QUIC, and TLS.
    server {
        listen 8443 ssl;
        listen 8443 quic reuseport;
        server_name example.test;

        http2 on;
        http3 on;
        quic_retry on;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate placeholder/fullchain.pem;
        ssl_certificate_key placeholder/privkey.pem;
        ssl_certificate_cache max=1000 inactive=20s valid=1m;
        ssl_conf_command Options PrioritizeChaCha;

        add_header Alt-Svc 'h3=":8443"; ma=86400' always;
        add_header_inherit merge;

        # Neither # nor braces inside strings should become comments or folds.
        set $quoted "hash # and braces { } stay inside this string";
        set $escaped "an escaped quote: \"quoted\"; a backslash: \\";
        set $single 'an escaped apostrophe: \'quoted\'; hash #; braces { }';
        set $unquoted $host;
        set $braced ${host};
        set $interpolated "host=$host; uri=${uri}; id=$request_id";
        set $fragment "https://example.test/page#section";
        set $path /data/$host/assets;

        location = /lexing {
            default_type text/plain;
            return 200 "${host}: $quoted; $escaped; $single\n"; # real comment
        }

        location ^~ /static/ {
            root placeholder/www;
            location /static/images/ {
                expires 1h;
            }
        }

        location ~* "^/images/[a-z0-9]{2,8}\\.(png|jpg)$" {
            try_files $uri @fallback;
        }

        location @fallback {
            proxy_pass http://application;
            proxy_set_header X-Request-ID $request_id;
            proxy_cookie_flags session secure httponly samesite=strict;
            proxy_pass_trailers on;
        }

        # Predicate location syntax, added in 1.31.5.
        location $is_preview {
            return 200 "preview for ${host}\n";
        }

        location / {
            early_hints $http_sec_fetch_mode;
            proxy_pass http://application;
        }
    }

    # Early body reading has its own server; it is incompatible with gRPC.
    server {
        listen 8081;
        client_body_early_read on;
        client_max_body_size 4k;

        location /json {
            return 200 "label=$request_label tag=$first_tag\n";
        }
    }

    server {
        listen 8082;
        http2 on;

        location /package.Service/ {
            grpc_pass grpc://127.0.0.1:50051;
            grpc_set_header X-Request-ID $request_id;
            grpc_read_timeout 30s;
        }
    }

    # CONNECT tunneling (ngx_http_tunnel_module, added in 1.31.0).
    server {
        listen 127.0.0.1:8083;
        tunnel_pass 127.0.0.1:9443;
        tunnel_connect_timeout 5s;
        tunnel_read_timeout 30s;
        tunnel_socket_keepalive on;
    }
}

# Stream and TLS preread require the corresponding optional modules.
stream {
    map $ssl_preread_server_name $backend {
        example.test 127.0.0.1:9443;
        default 127.0.0.1:9444;
    }

    server {
        listen 127.0.0.1:9445;
        ssl_preread on;
        proxy_pass $backend;
        proxy_connect_timeout 5s;
    }
}
